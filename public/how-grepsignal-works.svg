<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How GrepSignal Works</title>
  <desc id="desc">GrepSignal reviews AI sources, uses LLM-assisted semantic review and evidence gathering, applies an evidence-backed signal gate, and publishes verified signals to a website and structured JSON.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#172554" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8BA3BF"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 62px; font-weight: 760; fill: #07112D; letter-spacing: -1.7px; }
      .brand { font-size: 44px; font-weight: 760; fill: #07112D; letter-spacing: -1px; }
      .subtitle { font-size: 28px; font-weight: 500; fill: #5E718D; }
      .panel-title { font-size: 26px; font-weight: 720; fill: #10182F; }
      .body { font-size: 22px; font-weight: 500; fill: #1E293B; }
      .small { font-size: 17px; font-weight: 500; fill: #536580; }
      .tiny { font-size: 14px; font-weight: 600; fill: #536580; }
      .outcome { font-size: 17px; font-weight: 650; fill: #26334C; }
      .publish-label { font-size: 15px; font-weight: 700; fill: #26334C; }
      .publish-copy { font-size: 12.5px; font-weight: 600; fill: #536580; }
      .arrowline { stroke: #8BA3BF; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .dash { stroke: #A9B9CC; stroke-width: 2.5; fill: none; stroke-dasharray: 7 7; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Brand -->
  <g transform="translate(604 45)">
    <rect x="0" y="30" width="18" height="42" rx="9" fill="#2F6BDA"/>
    <rect x="28" y="16" width="18" height="56" rx="9" fill="#3D63DD"/>
    <rect x="56" y="0" width="18" height="72" rx="9" fill="#22B3B1"/>
    <text class="sans brand" x="102" y="55">GrepSignal</text>
  </g>
  <text class="sans title" x="800" y="185" text-anchor="middle">How GrepSignal Works</text>
  <text class="sans subtitle" x="800" y="235" text-anchor="middle">Detect real AI signals — not just AI news.</text>

  <!-- Main arrows -->
  <path class="arrowline" d="M 300 465 L 337 465"/>
  <path class="arrowline" d="M 610 465 L 647 465"/>
  <path class="arrowline" d="M 920 465 L 957 465"/>
  <path class="arrowline" d="M 1230 465 L 1267 465"/>

  <!-- Sources panel -->
  <g filter="url(#shadow)">
    <rect x="40" y="300" width="260" height="385" rx="24" fill="#FFFFFF" stroke="#CFE2F6" stroke-width="2"/>
    <path d="M64 300 H276 A24 24 0 0 1 300 324 V378 H40 V324 A24 24 0 0 1 64 300 Z" fill="#EAF4FF"/>
  </g>
  <g transform="translate(67 326)" fill="none" stroke="#2B78D6" stroke-width="4">
    <ellipse cx="18" cy="7" rx="16" ry="7" fill="#2B78D6" stroke="none"/>
    <path d="M2 8 V24 C2 30 34 30 34 24 V8"/>
    <path d="M2 16 C2 22 34 22 34 16"/>
  </g>
  <text class="sans panel-title" x="123" y="350">Sources</text>

  <rect x="68" y="406" width="42" height="42" rx="11" fill="#EEF2F7"/>
  <text class="sans tiny" x="89" y="433" text-anchor="middle" fill="#344256">SW</text>
  <text class="sans body" x="128" y="435">Simon Willison</text>

  <rect x="68" y="466" width="42" height="42" rx="11" fill="#FF6B1A"/>
  <text class="sans body" x="89" y="495" text-anchor="middle" fill="#FFFFFF">Y</text>
  <text class="sans body" x="128" y="495">Hacker News</text>

  <rect x="68" y="526" width="42" height="42" rx="11" fill="#EEF2F7"/>
  <circle cx="82" cy="547" r="3" fill="#6B7C93"/><circle cx="89" cy="547" r="3" fill="#6B7C93"/><circle cx="96" cy="547" r="3" fill="#6B7C93"/>
  <text class="sans body" x="128" y="555">More sources</text>

  <line x1="68" y1="594" x2="272" y2="594" stroke="#DCE6F2" stroke-width="2"/>
  <text class="sans small" x="68" y="627">Blogs, forums, releases,</text>
  <text class="sans small" x="68" y="654">research, and more.</text>

  <!-- Review panel -->
  <g filter="url(#shadow)">
    <rect x="350" y="300" width="260" height="330" rx="24" fill="#FFFFFF" stroke="#D7DAFF" stroke-width="2"/>
    <path d="M374 300 H586 A24 24 0 0 1 610 324 V378 H350 V324 A24 24 0 0 1 374 300 Z" fill="#EEF0FF"/>
  </g>
  <g transform="translate(380 326)" fill="none" stroke="#4B50C8" stroke-width="4" stroke-linejoin="round">
    <rect x="4" y="0" width="28" height="36" rx="3"/>
    <path d="M11 10 H25 M11 18 H25 M11 26 H22"/>
  </g>
  <text class="sans panel-title" x="435" y="350">Review</text>
  <rect x="365" y="394" width="230" height="36" rx="18" fill="#EEF3FA"/>
  <text class="sans tiny" x="480" y="417" text-anchor="middle">LLM-assisted semantic review</text>
  <g transform="translate(424 455)" fill="none" stroke="#1F2937" stroke-width="5" stroke-linecap="round">
    <circle cx="42" cy="36" r="28"/>
    <path d="M62 57 L83 78"/>
    <path d="M2 36 H16 M7 18 L18 24 M7 55 L18 49" stroke="#2993E8"/>
  </g>
  <text class="sans body" x="480" y="566" text-anchor="middle">Every candidate</text>
  <text class="sans body" x="480" y="594" text-anchor="middle">is checked</text>

  <!-- Review branches -->
  <path class="dash" d="M480 630 V660 H414 V678"/>
  <path class="dash" d="M480 630 V678"/>
  <path class="dash" d="M480 630 V660 H546 V678"/>

  <g filter="url(#shadow)">
    <rect x="360" y="678" width="110" height="78" rx="16" fill="#F4F6F8"/>
    <rect x="480" y="678" width="110" height="78" rx="16" fill="#FFF6EC"/>
    <rect x="600" y="678" width="110" height="78" rx="16" fill="#F1EEFF"/>
  </g>
  <circle cx="415" cy="704" r="10" fill="none" stroke="#667085" stroke-width="2.5"/>
  <path d="M408 697 L422 711" stroke="#667085" stroke-width="2.5"/>
  <text class="sans outcome" x="415" y="738" text-anchor="middle">Out of scope</text>
  <path d="M527 696 L543 712 M543 696 L527 712" stroke="#D97B29" stroke-width="3" stroke-linecap="round"/>
  <text class="sans outcome" x="535" y="738" text-anchor="middle">No signal</text>
  <ellipse cx="655" cy="704" rx="13" ry="8" fill="none" stroke="#5442C8" stroke-width="2.5"/>
  <circle cx="655" cy="704" r="4" fill="#5442C8"/>
  <text class="sans outcome" x="655" y="738" text-anchor="middle">Watch</text>

  <!-- Research panel -->
  <g filter="url(#shadow)">
    <rect x="660" y="300" width="260" height="330" rx="24" fill="#FFFFFF" stroke="#C9EEE8" stroke-width="2"/>
    <path d="M684 300 H896 A24 24 0 0 1 920 324 V378 H660 V324 A24 24 0 0 1 684 300 Z" fill="#E9FBF7"/>
  </g>
  <g transform="translate(690 326)" fill="none" stroke="#1AA38F" stroke-width="4" stroke-linejoin="round">
    <path d="M14 0 H30 M18 0 V13 L7 34 A5 5 0 0 0 12 42 H36 A5 5 0 0 0 41 34 L30 13 V0"/>
    <path d="M13 30 H35"/>
  </g>
  <text class="sans panel-title" x="744" y="350">Research</text>
  <rect x="675" y="394" width="230" height="36" rx="18" fill="#EAF7F7"/>
  <text class="sans tiny" x="790" y="417" text-anchor="middle">LLM-assisted evidence gathering</text>
  <g transform="translate(728 458)">
    <rect x="0" y="0" width="58" height="70" rx="8" fill="#DDF7EF" stroke="#64CDBA" stroke-width="3"/>
    <path d="M14 20 H44 M14 32 H39 M14 44 H36" stroke="#64CDBA" stroke-width="3" stroke-linecap="round"/>
    <circle cx="63" cy="54" r="18" fill="#FFFFFF" stroke="#2B78D6" stroke-width="4"/>
    <path d="M76 67 L90 81" stroke="#2B78D6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text class="sans body" x="790" y="566" text-anchor="middle">Gather evidence</text>
  <text class="sans body" x="790" y="594" text-anchor="middle">when needed</text>

  <!-- Signal Gate panel -->
  <g filter="url(#shadow)">
    <rect x="970" y="300" width="260" height="330" rx="24" fill="#FFFFFF" stroke="#CFE2F6" stroke-width="2"/>
    <path d="M994 300 H1206 A24 24 0 0 1 1230 324 V378 H970 V324 A24 24 0 0 1 994 300 Z" fill="#EAF4FF"/>
  </g>
  <path d="M1005 326 H1043 L1028 344 V362 H1020 V344 Z" fill="#2B78D6"/>
  <text class="sans panel-title" x="1112" y="350" text-anchor="middle">Signal Gate</text>
  <rect x="985" y="394" width="230" height="36" rx="18" fill="#EEF3FA"/>
  <text class="sans tiny" x="1100" y="417" text-anchor="middle">Evidence-backed policy</text>
  <g transform="translate(1042 458)">
    <rect x="0" y="0" width="70" height="70" rx="10" fill="#EEF4FF"/>
    <path d="M15 18 H48 M15 31 H48 M15 44 H39" stroke="#4E83D1" stroke-width="4" stroke-linecap="round"/>
    <circle cx="61" cy="57" r="20" fill="#2B78D6"/>
    <path d="M51 57 L58 64 L71 49" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="sans body" x="1100" y="566" text-anchor="middle">Only material</text>
  <text class="sans body" x="1100" y="594" text-anchor="middle">signals pass</text>

  <!-- Gate branches -->
  <path class="dash" d="M1100 630 V660 H1050 V678"/>
  <path class="dash" d="M1100 630 V660 H1150 V678"/>
  <g filter="url(#shadow)">
    <rect x="995" y="678" width="110" height="78" rx="16" fill="#FFF6EC"/>
    <rect x="1115" y="678" width="110" height="78" rx="16" fill="#F1EEFF"/>
  </g>
  <circle cx="1050" cy="704" r="10" fill="none" stroke="#D97B29" stroke-width="2.5"/>
  <path d="M1043 697 L1057 711" stroke="#D97B29" stroke-width="2.5"/>
  <text class="sans outcome" x="1050" y="738" text-anchor="middle">No signal</text>
  <ellipse cx="1170" cy="704" rx="13" ry="8" fill="none" stroke="#5442C8" stroke-width="2.5"/>
  <circle cx="1170" cy="704" r="4" fill="#5442C8"/>
  <text class="sans outcome" x="1170" y="738" text-anchor="middle">Watch</text>

  <!-- Publish panel -->
  <g filter="url(#shadow)">
    <rect x="1280" y="300" width="280" height="385" rx="24" fill="#FFFFFF" stroke="#C9EEE8" stroke-width="2"/>
    <path d="M1304 300 H1536 A24 24 0 0 1 1560 324 V378 H1280 V324 A24 24 0 0 1 1304 300 Z" fill="#E9FBF7"/>
  </g>
  <g transform="translate(1310 325)" fill="#1A9E8E">
    <path d="M0 14 L28 5 V36 L0 28 Z"/>
    <rect x="28" y="12" width="6" height="16" rx="3"/>
    <path d="M7 27 L12 43 H21 L16 25 Z"/>
  </g>
  <text class="sans panel-title" x="1362" y="350">Publish</text>
  <text class="sans body" x="1420" y="424" text-anchor="middle">Human-readable site +</text>
  <text class="sans body" x="1420" y="452" text-anchor="middle">structured JSON</text>

  <rect x="1298" y="485" width="116" height="150" rx="16" fill="#F0F7FF"/>
  <rect x="1426" y="485" width="116" height="150" rx="16" fill="#F3F2FF"/>
  <rect x="1330" y="510" width="62" height="48" rx="6" fill="none" stroke="#2B78D6" stroke-width="4"/>
  <line x1="1330" y1="522" x2="1392" y2="522" stroke="#2B78D6" stroke-width="4"/>
  <circle cx="1339" cy="516" r="2.5" fill="#2B78D6"/><circle cx="1348" cy="516" r="2.5" fill="#2B78D6"/>
  <text class="sans publish-label" x="1361" y="586" text-anchor="middle">Website</text>
  <text class="sans publish-copy" x="1361" y="610" text-anchor="middle">Browse the</text>
  <text class="sans publish-copy" x="1361" y="628" text-anchor="middle">latest signals</text>

  <path d="M1461 508 H1501 L1515 522 V560 H1461 Z" fill="none" stroke="#6666CC" stroke-width="3" stroke-linejoin="round"/>
  <path d="M1501 508 V522 H1515" fill="none" stroke="#6666CC" stroke-width="3"/>
  <text class="sans body" x="1488" y="550" text-anchor="middle" fill="#6666CC">{ }</text>
  <text class="sans publish-label" x="1488" y="584" text-anchor="middle">Agents /</text>
  <text class="sans publish-label" x="1488" y="602" text-anchor="middle">JSON</text>
  <text class="sans publish-copy" x="1488" y="624" text-anchor="middle">Machine-readable</text>
  <text class="sans publish-copy" x="1488" y="642" text-anchor="middle">data feed</text>

  <!-- Footer principle -->
  <line x1="70" y1="830" x2="330" y2="830" stroke="#D7E0EA" stroke-width="2"/>
  <line x1="1270" y1="830" x2="1530" y2="830" stroke="#D7E0EA" stroke-width="2"/>
  <text class="sans small" x="800" y="837" text-anchor="middle" fill="#5E718D">Never create content because a keyword exists. Make genuine signals maximally discoverable.</text>
</svg>
