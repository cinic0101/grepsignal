name: Deploy GitHub Pages beta
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://cinic0101.github.io
          PUBLIC_BASE_PATH: /grepsignal/
          HISTORY_BASE_REF: ${{ github.event.before || github.sha }}
      - run: node scripts/check-built-accountability.mjs
        env:
          PUBLIC_BASE_PATH: /grepsignal/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
